<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Teleprompter</title>
  <link rel="stylesheet" href="teleprompter.css">
</head>
<body>
  <div id="app">
    <header>
      <span id="counter">0/0</span>
      <span id="title"></span>
      <span class="btns">
        <button id="prev" title="Anterior (←)">◀</button>
        <button id="next" title="Próximo (→ / clique)">▶</button>
        <button id="smaller" title="Fonte menor (-)">A-</button>
        <button id="bigger" title="Fonte maior (+)">A+</button>
        <button id="pip" title="Fixar sempre no topo (Picture-in-Picture)">📌</button>
      </span>
    </header>
    <main id="content"></main>
  </div>
  <script src="lib.js"></script>
  <script src="teleprompter.js"></script>
</body>
</html>

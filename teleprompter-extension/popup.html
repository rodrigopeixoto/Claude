<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Mini Teleprompter</title>
  <style>
    body { width: 420px; margin: 0; padding: 12px; font: 13px system-ui, sans-serif; color: #1a1a1a; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    label { display: block; font-weight: 600; margin: 8px 0 4px; }
    textarea { width: 100%; height: 220px; box-sizing: border-box; font: 12px ui-monospace, monospace; padding: 6px; }
    .row { display: flex; gap: 6px; }
    input[type=url] { flex: 1; padding: 6px; }
    button { padding: 6px 12px; cursor: pointer; }
    #send { background: #1a73e8; color: #fff; border: 0; border-radius: 4px; font-weight: 600; margin-top: 10px; width: 100%; padding: 9px; }
    #status { margin-top: 6px; min-height: 16px; color: #555; }
    #status.err { color: #c5221f; }
    .hint { color: #666; font-size: 11px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Mini Teleprompter</h1>

  <label for="url">Carregar de URL</label>
  <div class="row">
    <input id="url" type="url" placeholder="https://docs.google.com/document/d/...">
    <button id="load">Carregar</button>
  </div>

  <label for="text">Conteúdo</label>
  <textarea id="text" placeholder="Slide 1: Abertura&#10;**Bem-vindos** ao encontro&#10;- ponto um&#10;- ponto dois&#10;&#10;Slide 2: Contexto&#10;1. primeiro&#10;2. segundo"></textarea>
  <div class="hint">Marque cada slide com <code>Slide N</code>. Suporta **negrito**, *itálico*, # títulos, - bullets, 1. listas. Sem marcador: separe com <code>---</code>.</div>

  <button id="send">Enviar e abrir teleprompter</button>
  <div id="status"></div>

  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meetscheduler
      POSTGRES_PASSWORD: meetscheduler
      POSTGRES_DB: meetscheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  gojiberry-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gojiberry
      POSTGRES_PASSWORD: gojiberry
      POSTGRES_DB: gojiberry
    ports:
      - "5433:5432"
    volumes:
      - gojiberry_postgres_data:/var/lib/postgresql/data

  gojiberry-redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - gojiberry_redis_data:/data

volumes:
  postgres_data:
  redis_data:
  gojiberry_postgres_data:
  gojiberry_redis_data:
